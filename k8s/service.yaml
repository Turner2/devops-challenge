apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  type: ClusterIP # exposed to the internet only through the ALB Ingress
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
    - name: http
      port: 80
      targetPort: http
