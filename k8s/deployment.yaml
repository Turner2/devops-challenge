apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: production
  labels:
    app: product-catalog
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: product-catalog
        version: "1.0.0"
    spec:
      containers:
        - name: product-catalog
          image: 378388077304.dkr.ecr.us-east-1.amazonaws.com/devops-challenge-product-catalog:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: product-catalog-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
